# Fil pilote driver: two opto-triacs (SSR1/SSR2) shape the 230 V signal
# sent to the radiator's pilot wire.
#
#   Mode      | Pilot wire signal        | SSR1 | SSR2
#   ----------|--------------------------|------|-----
#   Confort   | none (open)              | OFF  | OFF
#   Éco       | full sine wave           | ON   | ON
#   Hors-gel  | negative half-wave only  | ON   | OFF
#   Arrêt     | positive half-wave only  | OFF  | ON
#
# SSR1 = U2 + D1 (passes the negative half-wave), driven by ${ssr1_pin} (D3)
# SSR2 = U3 + D2 (passes the positive half-wave), driven by ${ssr2_pin} (D7)
# The GPIO sinks the opto LED current, hence `inverted: true`.

switch:
  - platform: gpio
    pin:
      number: ${ssr1_pin}
      inverted: true
    id: ssr1
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    pin:
      number: ${ssr2_pin}
      inverted: true
    id: ssr2
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

# Mode selector exposed to Home Assistant
select:
  - platform: template
    name: "Fil Pilote ${ch_name}"
    id: fil_pilote_select
    icon: "mdi:radiator"
    optimistic: true
    restore_value: true
    options:
      - "Confort"
      - "Éco"
      - "Hors-gel"
      - "Arrêt"
    initial_option: "Confort"
    on_value:
      then:
        - lambda: |-
            if (x == "Confort") {
              id(ssr1).turn_off();
              id(ssr2).turn_off();
            } else if (x == "Éco") {
              id(ssr1).turn_on();
              id(ssr2).turn_on();
            } else if (x == "Hors-gel") {
              id(ssr1).turn_on();
              id(ssr2).turn_off();
            } else if (x == "Arrêt") {
              id(ssr1).turn_off();
              id(ssr2).turn_on();
            }
