# Shared base configuration: board, API, OTA, WiFi fallback AP, diagnostics.
# Nothing here references a custom !secret so this package can be pulled in
# remotely (ESPHome dashboard "adopt" flow). WiFi credentials and the API
# encryption key are set in the per-device YAML (see ../maxpilot_ch1.yaml).

esp8266:
  board: d1_mini
  restore_from_flash: true

dashboard_import:
  package_import_url: github://zefr0g/maxpilot/esphome/maxpilot_ch1.yaml@main
  import_full_config: false

api:

ota:
  - platform: esphome

logger:

captive_portal:

wifi:
  power_save_mode: NONE
  # Fallback hotspot (captive portal) if the WiFi connection fails
  ap:
    ssid: "MaxPilot Fallback"

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
