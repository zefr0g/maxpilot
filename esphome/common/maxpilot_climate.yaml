# Optional thermostat. Imports a room temperature sensor from Home Assistant
# and toggles the pilot wire between Confort (heating) and Éco (idle) around
# the setpoint. Requires the substitution `temp_sensor_entity`.
#
# Thermostat optionnel. Importe un capteur de température depuis Home
# Assistant et bascule le fil pilote entre Confort (chauffe) et Éco (repos)
# autour de la consigne. Nécessite la substitution `temp_sensor_entity`.

sensor:
  - platform: homeassistant
    name: "Température ${ch_name}"
    id: room_temp
    entity_id: ${temp_sensor_entity}
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - filter_out: nan

climate:
  - platform: thermostat
    name: "Radiateur ${ch_name}"
    id: fil_pilote_climate
    icon: "mdi:radiator"
    sensor: room_temp
    visual:
      min_temperature: 7
      max_temperature: 28
      temperature_step: 0.5
    min_idle_time: 5min
    min_heating_off_time: 5min
    min_heating_run_time: 5min
    heat_deadband: 0.5
    heat_overrun: 0.5
    # The select drives the SSRs, so every mode change goes through it and
    # Home Assistant always shows the real pilot wire state.
    heat_action:
      - select.set:
          id: fil_pilote_select
          option: "Confort"
    idle_action:
      - select.set:
          id: fil_pilote_select
          option: "Éco"
    off_mode:
      - select.set:
          id: fil_pilote_select
          option: "Arrêt"
    default_preset: Confort
    preset:
      - name: Confort
        default_target_temperature_low: 19
        mode: heat
      - name: Éco
        default_target_temperature_low: 17
        mode: heat
      - name: Hors-gel
        default_target_temperature_low: 7
        mode: heat
      - name: Absent
        default_target_temperature_low: 7
        mode: "off"
