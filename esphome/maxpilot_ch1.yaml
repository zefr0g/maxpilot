# MaxPilot — one board, one pilot wire (several radiators can share it).
# Copy this file per board and change `name` / `ch_name`.
#
# Flash:  esphome run esphome/maxpilot_ch1.yaml
# Thermostat: see maxpilot_ch1_with_temp.yaml.example

substitutions:
  name: maxpilot-ch1
  ch_name: "CH1"
  ssr1_pin: D3
  ssr2_pin: D7

packages:
  core: !include common/core.yaml
  maxpilot: !include common/maxpilot.yaml

esphome:
  name: ${name}
  friendly_name: "MaxPilot ${ch_name}"
  project:
    name: "zefr0g.maxpilot"
    version: "2.0.0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key
